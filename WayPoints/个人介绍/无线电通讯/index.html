<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>无线电通讯 - BG5FNH</title>
  <script>window.BG5FNH_ROOT = "../../../";</script>
  <link rel="stylesheet" href="../../../assets/style.css" />
  <style>
    /* 本页专用：设备信息表 + 照片网格（只用黑金变量，不动通用样式） */
    .card .rig-table {
      display: grid;
      gap: 10px;
      margin: 12px 0 6px;
    }

    .card .rig-row {
      display: grid;
      grid-template-columns: 62px 1fr;
      gap: 14px;
      align-items: baseline;
      padding: 11px 15px;
      border: 1px solid rgba(201, 168, 106, 0.18);
      border-radius: 10px;
      background: rgba(201, 168, 106, 0.04);
    }

    .card .rig-row .k {
      color: var(--gold);
      font-size: 13px;
      letter-spacing: 2px;
    }

    .card .rig-row .v {
      font-size: 14px;
      line-height: 1.75;
      color: var(--text);
    }

    .card .shots {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin: 14px 0 6px;
    }

    .card .shot {
      display: block;
      overflow: hidden;
      border: 1px solid rgba(201, 168, 106, 0.22);
      border-radius: 12px;
      background: #0b0b0d;
      text-decoration: none;
      transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
    }

    .card .shot:hover {
      border-color: rgba(201, 168, 106, 0.62);
      box-shadow: 0 0 26px rgba(201, 168, 106, 0.18);
      transform: translateY(-2px);
    }

    .card .shot .ph {
      display: block;
      aspect-ratio: 4 / 3;
      overflow: hidden;
    }

    .card .shot img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: 0;
    }

    .card .shot .cap {
      display: block;
      padding: 9px 13px;
      font-size: 12px;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    .card .shot.wide {
      grid-column: 1 / -1;
    }

    .card .shot.wide .ph {
      aspect-ratio: 16 / 9;
    }

    /* 竖版单据（电台执照）：完整显示，不裁切 */
    .card .shot.doc .ph {
      aspect-ratio: 4 / 5;
      background: #0b0b0d;
    }

    .card .shot.doc img {
      object-fit: contain;
    }

    @media (max-width: 640px) {
      .card .shots {
        grid-template-columns: 1fr;
      }

      .card .rig-row {
        grid-template-columns: 52px 1fr;
        gap: 10px;
      }
    }
  </style>
</head>
