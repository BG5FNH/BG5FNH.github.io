  <script>
    (function () {
      'use strict';
      var DATA = window.__CONTEST__ || [];
      var TIERS = [
        { id: 'T0', label: 'T0 顶级', note: '保研强加分，行业硬通货' },
        { id: 'T1', label: 'T1 高认可度', note: '综测加满，性价比高' },
        { id: 'T2', label: 'T2 练手 / 积累', note: '门槛低、频次高，先练手' },
        { id: 'T3', label: 'T3 避雷区', note: '不碰' }
      ];
      var root = document.getElementById('ctRoot');
      var countEl = document.getElementById('ctCount');
      var search = document.getElementById('ctSearch');
      var chips = document.getElementById('ctChips');
      var state = { tier: 'all', q: '' };

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
      }
      function hay(it) {
        return [it.name, it.note, it.desc, it.people, it.format, it.time, it.cat]
          .join(' ').toLowerCase();
      }

      function cardHTML(it, i) {
        var plain = it.tier === 'T3';
        var meta = it.time || '';

        var rows = '';
        if (it.time) rows += '<div class="ct-row"><span class="k">时间</span><span class="v">' + esc(it.time) + '</span></div>';
        if (it.people) rows += '<div class="ct-row"><span class="k">组队</span><span class="v">' + esc(it.people) + '</span></div>';
        if (it.format) rows += '<div class="ct-row"><span class="k">赛制</span><span class="v">' + esc(it.format) + '</span></div>';
        if (it.note) rows += '<div class="ct-row"><span class="k">备注</span><span class="v">' + esc(it.note) + '</span></div>';
        if (it.desc) rows += '<div class="ct-row"><span class="k">说明</span><span class="v">' + esc(it.desc) + '</span></div>';

        return '<article class="ct' + (plain ? ' plain' : '') + '" data-tier="' + it.tier + '" data-idx="' + i + '">' +
          '<button class="ct-head" type="button">' +
            '<span class="ct-badge">' + it.tier + '</span>' +
            '<span class="ct-name">' + esc(it.name) + '</span>' +
            (meta ? '<span class="ct-meta">' + esc(meta) + '</span>' : '') +
            (plain ? '' : '<span class="ct-caret" aria-hidden="true"></span>') +
          '</button>' +
          '<div class="ct-body">' + rows + '</div>' +
        '</article>';
      }

      function render() {
        var q = state.q.trim().toLowerCase();
        var html = '';
        var shown = 0;

        TIERS.forEach(function (t) {
          if (state.tier !== 'all' && state.tier !== t.id) return;
          var list = DATA.filter(function (it) {
            if (it.tier !== t.id) return false;
            if (!q) return true;
            return hay(it).indexOf(q) >= 0;
          });
          if (!list.length) return;
          shown += list.length;

          html += '<section class="ct-sec" data-tier="' + t.id + '">' +
            '<div class="ct-sec-head"><h2>' + t.label + '</h2>' +
            '<span class="ct-sec-note">' + t.note + ' · ' + list.length + ' 项</span></div>';

          var lastCat = null;
          html += '<div class="ct-list">';
          list.forEach(function (it) {
            if (t.id === 'T2' && it.cat && it.cat !== lastCat) {
              html += '</div><div class="ct-cat">' + esc(it.cat) + '</div><div class="ct-list">';
              lastCat = it.cat;
            }
            html += cardHTML(it, DATA.indexOf(it));
          });
          html += '</div></section>';
        });

        root.innerHTML = html || '<p class="ct-count">没有匹配的竞赛，换个关键词试试。</p>';
        countEl.textContent = '显示 ' + shown + ' / ' + DATA.length + ' 项';
      }

      root.addEventListener('click', function (e) {
        var head = e.target.closest ? e.target.closest('.ct-head') : null;
        if (!head) return;
        var card = head.parentNode;
        if (card.className.indexOf('plain') >= 0) return;
        card.classList.toggle('open');
      });

      chips.addEventListener('click', function (e) {
        var b = e.target.closest ? e.target.closest('.ct-chip') : null;
        if (!b) return;
        Array.prototype.forEach.call(chips.querySelectorAll('.ct-chip'), function (c) { c.classList.remove('on'); });
        b.classList.add('on');
        state.tier = b.getAttribute('data-tier');
        render();
      });

      document.getElementById('ctOpenAll').addEventListener('click', function () {
        Array.prototype.forEach.call(root.querySelectorAll('.ct'), function (c) { c.classList.add('open'); });
      });
      document.getElementById('ctCloseAll').addEventListener('click', function () {
        Array.prototype.forEach.call(root.querySelectorAll('.ct'), function (c) { c.classList.remove('open'); });
      });

      search.addEventListener('input', function () { state.q = search.value; render(); });
      document.addEventListener('keydown', function (e) {
        if (e.key === '/' && document.activeElement !== search) { e.preventDefault(); search.focus(); }
        if (e.key === 'Escape' && document.activeElement === search) { search.value = ''; state.q = ''; render(); search.blur(); }
      });

      render();
    })();
  </script>
  <script src="../../../assets/page.js"></script>
