<head>

  <link rel="stylesheet" href="../../../../../assets/style.css" />
  <style>
    .bp-lead { margin: 0 0 10px; font-size: 14px; line-height: 1.85; }
    .bp-rule { margin: 12px 0 0; padding: 11px 13px; border-radius: 10px; font-size: 12px; line-height: 1.8;
      color: var(--text-muted); background: rgba(201, 168, 106, 0.045); border: 1px dashed rgba(201, 168, 106, 0.28); }
    .bp-rule b { color: var(--gold); }

    .bp-tools { position: sticky; top: 0; z-index: 6; padding: 8px 0 8px;
      background: linear-gradient(180deg, rgba(11,11,13,0.97) 78%, rgba(11,11,13,0)); }
    .bp-search { width: 100%; padding: 9px 14px; background: rgba(201,168,106,0.05);
      border: 1px solid rgba(201,168,106,0.3); border-radius: 999px; color: var(--text);
      font-family: inherit; font-size: 13px; outline: none; }
    .bp-search:focus { border-color: rgba(201,168,106,0.62); }
    .bp-chips { display: flex; gap: 7px; margin-top: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .bp-chips::-webkit-scrollbar { display: none; }
    .bp-chip { flex: 0 0 auto; padding: 4px 11px; border-radius: 999px; border: 1px solid rgba(201,168,106,0.28);
      background: transparent; color: var(--text-muted); font-family: inherit; font-size: 11.5px; cursor: pointer; }
    .bp-chip.on { background: var(--gold); border-color: var(--gold); color: #0b0b0d; font-weight: 600; }
    .bp-chip .n { margin-left: 5px; font-size: 9.5px; opacity: .7; }
    .bp-count { margin: 8px 0 2px; font-size: 11.5px; color: var(--text-muted); }

    /* 列表：一行一块板，只放短名 + 品牌色 + 档位点 */
    .bp-list { margin-top: 6px; }
    .bp-item { display: flex; align-items: center; gap: 9px; padding: 8px 10px;
      border-bottom: 1px solid rgba(201,168,106,0.09); cursor: pointer; }
    .bp-item:active { background: rgba(201,168,106,0.09); }
    .bp-bar { flex: 0 0 3px; height: 20px; border-radius: 2px; }
    .bp-name { flex: 1 1 auto; min-width: 0; font-size: 13px; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bp-name em { font-style: normal; color: var(--text-muted); font-size: 10.5px; margin-left: 6px; }
    .bp-dot { flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%; }
    .bp-arrow { flex: 0 0 auto; color: rgba(168,152,120,0.5); font-size: 12px; }
    .bp-empty { padding: 22px 0; text-align: center; font-size: 12.5px; color: var(--text-muted); }

    /* 详情：手机底部抽屉 / 桌面居中浮层 */
    .bp-sheet { position: fixed; inset: 0; z-index: 80; display: none; }
    .bp-sheet.on { display: block; }
    .bp-mask { position: absolute; inset: 0; background: rgba(0,0,0,0.62); }
    .bp-panel { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow-y: auto;
      -webkit-overflow-scrolling: touch; background: #0d0c10; border-top: 1px solid rgba(201,168,106,0.35);
      border-radius: 16px 16px 0 0; padding: 14px 16px calc(20px + env(safe-area-inset-bottom));
      transform: translateY(100%); transition: transform 0.26s cubic-bezier(0.2,0.8,0.2,1); }
    .bp-sheet.on .bp-panel { transform: translateY(0); }
    .bp-grab { width: 42px; height: 4px; border-radius: 2px; background: rgba(201,168,106,0.35); margin: 0 auto 12px; }
    .bp-close { position: absolute; top: 10px; right: 12px; width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid rgba(201,168,106,0.35); background: rgba(201,168,106,0.08); color: var(--gold);
      font-size: 20px; line-height: 1; cursor: pointer; }
    .bp-h { margin: 2px 44px 2px 0; font-size: 16px; color: var(--gold); letter-spacing: .5px; }
    .bp-sub { margin: 0 0 12px; font-size: 11.5px; color: var(--text-muted); }
    .bp-figs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .bp-fig { margin: 0; }
    .bp-fig img { width: 100%; height: auto; display: block; border-radius: 9px; border: 1px solid rgba(201,168,106,0.22); background: #0f0e12; }
    .bp-fig figcaption { margin-top: 5px; font-size: 10.5px; line-height: 1.5; color: var(--text-muted); }
    .bp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: rgba(201,168,106,0.12);
      border: 1px solid rgba(201,168,106,0.12); border-radius: 10px; overflow: hidden; }
    .bp-cell { background: #0d0c10; padding: 8px 10px; }
    .bp-cell i { display: block; font-style: normal; font-size: 10.5px; color: var(--text-muted); }
    .bp-cell b { display: block; margin-top: 2px; font-size: 13px; color: var(--text); font-weight: 500; }
    .bp-cell b.u { color: rgba(168,152,120,0.85); font-size: 12px; }
    .bp-note { margin: 10px 0 0; font-size: 12px; line-height: 1.75; color: var(--text-muted); }
    .bp-src { margin-top: 8px; font-size: 11px; line-height: 1.7; color: var(--text-muted); }
    .bp-src a { color: var(--gold); text-decoration: none; border-bottom: 1px solid rgba(201,168,106,0.4); }

    @media (min-width: 720px) {
      .bp-panel { left: 50%; right: auto; bottom: auto; top: 50%; width: 620px; max-height: 84vh;
        transform: translate(-50%, -46%); border-radius: 14px; border: 1px solid rgba(201,168,106,0.35); opacity: 0;
        transition: transform .24s ease, opacity .24s ease; }
      .bp-sheet.on .bp-panel { transform: translate(-50%, -50%); opacity: 1; }
      .bp-grab { display: none; }
      .bp-item { padding: 7px 10px; }
      .bp-name { font-size: 13.5px; }
    }
  </style>

t":4,"spi":1,"i2c":1},"adc":16,"radio":"无","cm":null,"src":"https://docs.arduino.cc/hardware/mega-2560/","note":"54 数字 + 16 模拟、4 路串口，引脚最多的经典 Arduino。","tier":"lo","photo":null,"photoMeta":null},{"id":"leonardo","fam":"arduino","sn":"Leonardo","n":"Arduino Leonardo","mcu":"ATmega32U4","core":"AVR 8-bit","cores":1,"mhz":16,"sram":2.5,"flash":32,"gpio":20,"bus":{"uart":1,"spi":1,"i2c":1},"adc":12,"radio":"无","cm":null,"src":"https://docs.arduino.cc/hardware/leonardo/","note":"32U4 自带 USB，可以直接模拟键盘/鼠标，不用外挂转换芯片。","tier":"lo","photo":null,"photoMeta":null},{"id":"micro","fam":"arduino","sn":"Micro","n":"Arduino Micro","mcu":"ATmega32U4","core":"AVR 8-bit","cores":1,"mhz":16,"sram":2.5,"flash":32,"gpio":20,"bus":{"uart":1,"spi":1,"i2c":1},"adc":12,"radio":"无","cm":null,"src":"https://docs.arduino.cc/hardware/micro/","note":"Leonardo 的小板版，排针间距与面包板兼容。","tier":"lo","photo":null,"photoMeta":null},{"id":"pi-5","fam":"rpi","sn":"Pi 5","n":"Raspberry Pi 5","mcu":"BCM2712","core":"Cortex-A76 四核","cores":4,"mhz":2400,"sram":8192,"flash":null,"gpio":28,"bus":{"uart":1,"spi":2,"i2c":2},"adc":null,"radio":"Wi-Fi 5 + BT 5","cm":null,"src":"https://www.raspberrypi.com/products/raspberry-pi-5/","note":"内存是 LPDDR4X（4/8 GB 可选，这里按 8 GB 记）；系统跑在 microSD 或 NVMe（需 M.2 HAT），无板载 eMMC。","tier":"hi","photo":null,"photoMeta":null},{"id":"pi-4b","fam":"rpi","sn":"Pi 4B","n":"Raspberry Pi 4 Model B","mcu":"BCM2711","core":"Cortex-A72 四核","cores":4,"mhz":1500,"sram":8192,"flash":null,"gpio":28,"bus":{"uart":1,"spi":2,"i2c":2},"adc":null,"radio":"Wi-Fi 5 + BT 5","cm":null,"src":"https://www.raspberrypi.com/products/raspberry-pi-4-model-b/","note":"内存 1/2/4/8 GB 可选，按 8 GB 记；双 micro-HDMI、USB 3.0 ×2。","tier":"hi","photo":null,"photoMeta":null},{"id":"pi-3b-plus","fam":"rpi","sn":"Pi 3B+","n":"Raspberry Pi 3 Model B+","mcu":"BCM2837B0","core":"Cortex-A53 四核","cores":4,"mhz":1400,"sram":1024,"flash":null,"gpio":28,"bus":{"uart":1,"spi":2,"i2c":2},"adc":null,"radio":"Wi-Fi 5 + BT 4.2","cm":null,"src":"https://www.raspberrypi.com/products/raspberry-pi-3-model-b-plus/","note":"1 GB LPDDR2；千兆网口（经 USB 2.0 通道，实测约 300 Mbps）。","tier":"hi","photo":null,"photoMeta":null},{"id":"pi-zero-2w","fam":"rpi","sn":"Zero 2 W","n":"Raspberry Pi Zero 2 W","mcu":"RP3A0（BCM2710A1）","core":"Cortex-A53 四核","cores":4,"mhz":1000,"sram":512,"flash":null,"gpio":28,"bus":{"uart":1,"spi":2,"i2c":2},"adc":null,"radio":"Wi-Fi 4 + BT 4.2","cm":null,"src":"https://www.raspberrypi.com/products/raspberry-pi-zero-2-w/","note":"65×30 mm 小板，未焊接 40 排针（需自己焊）。","tier":"hi","photo":null,"photoMeta":null},{"id":"cm4","fam":"rpi","sn":"CM4","n":"Raspberry Pi Compute Module 4","mcu":"BCM2711","core":"Cortex-A72 四核","cores":4,"mhz":1500,"sram":8192,"flash":null,"gpio":28,"bus":{"uart":1,"spi":2,"i2c":2},"adc":null,"radio":"可选 Wi-Fi 5 + BT 5","cm":null,"src":"https://www.raspberrypi.com/products/compute-module-4/","note":"核心板形态，需要底板；可选 eMMC（8~32 GB）或仅 SD，内存按 8 GB 记。","tier":"hi","photo":null,"photoMeta":null},{"id":"pico","fam":"rpi","sn":"Pico","n":"Raspberry Pi Pico","mcu":"RP2040","core":"Cortex-M0+ 双核","cores":2,"mhz":133,"sram":264,"flash":2048,"gpio":26,"bus":{"uart":2,"spi":2,"i2c":2},"adc":3,"radio":"无","cm":null,"src":"https://datasheets.raspberrypi.com/pico/pico-datasheet.pdf","note":"PIO 可编程 IO 是它的特色；26 个 GPIO 里 3 个可做 ADC。","tier":"mid","photo":null,"photoMeta":null},{"id":"pico-w","fam":"rpi","sn":"Pico W","n":"Raspberry Pi Pico W","mcu":"RP2040 + CYW43439","core":"Cortex-M0+ 双核","cores":2,"mhz":133,"sram":264,"flash":2048,"gpio":26,"bus":{"uart":2,"spi":2,"i2c":2},"adc":3,"radio":"Wi-Fi 4","cm":null,"src":"https://datasheets.raspberrypi.com/picow/pico-w-datasheet.pdf","note":"在 Pico 基础上加 Wi-Fi；蓝牙在 Pico W 上不可用（Pico 2 W 才有）。","tier":"mid","photo":null,"photoMeta":null},{"id":"pico-2","fam":"rpi","sn":"Pico 2","n":"Raspberry Pi Pico 2","mcu":"RP2350","core":"Cortex-M33 双核","cores":2,"mhz":150,"sram":520,"flash":4096,"gpio":26,"bus":{"uart":2,"spi":2,"i2c":2},"adc":3,"radio":"无","cm":1002,"src":"https://datasheets.raspberrypi.com/pico/pico-2-datasheet.pdf","note":"可在 M33 与 RISC-V Hazard3 之间选启动架构；4 MB Flash。","tier":"mid","photo":null,"photoMeta":null}];</script>
  <script>
    (function () {
      'use strict';
      var DATA = window.__BOARDS__ || [];
      var BRAND = {"esp32":"乐鑫","stm32":"ST","arduino":"Arduino","rpi":"树莓派"}, BC = {"esp32":"#d1495b","stm32":"#8fd0ef","arduino":"#e0b25c","rpi":"#a8e8b4"};
      var TC = {"hi":"#d1495b","mid":"#e0b25c","lo":"#8a8a92"}, TL = {"hi":"高性能","mid":"主流","lo":"入门"};
      var state = { fam: 'all', q: '' };

      function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
      function busOf(b) { return (b.bus.uart || 0) + (b.bus.spi || 0) + (b.bus.i2c || 0); }
      function extOf(b) {
        var pin = Math.min(4, (b.gpio || 0) / 10), bus = Math.min(4, busOf(b) / 2), eco = 0;
        if (b.fam === 'rpi' || b.fam === 'arduino') eco += 1; else if (b.gpio >= 20) eco += 1;
        if (b.radio && b.radio.indexOf('无') !== 0) eco += 1;
        return Math.round(Math.min(10, pin + bus + eco) * 10) / 10;
      }
      function u(v, unit) { return v == null ? '未确认' : v + (unit || ''); }

      // URL 里带 ?fam=esp32 就直接筛好（星图的分系列光点用这个）
      var m = /[?&]fam=(esp32|stm32|arduino|rpi)/.exec(location.search);
      if (m) state.fam = m[1];

      var listEl = document.getElementById('bpList'), countEl = document.getElementById('bpCount'),
          searchEl = document.getElementById('bpSearch'), chipsEl = document.getElementById('bpChips');

      function visible() {
        var q = state.q.trim().toLowerCase();
        return DATA.filter(function (b) {
          if (state.fam !== 'all' && b.fam !== state.fam) return false;
          if (q && (b.sn + ' ' + b.n + ' ' + b.mcu + ' ' + b.core + ' ' + BRAND[b.fam]).toLowerCase().indexOf(q) < 0) return false;
          return true;
        }).sort(function (x, y) {
          var rank = { hi: 0, mid: 1, lo: 2 };
          if (rank[x.tier] !== rank[y.tier]) return rank[x.tier] - rank[y.tier];
          return (y.cm || y.mhz * 10) - (x.cm || x.mhz * 10);
        });
      }

      function render() {
        var list = visible();
        countEl.textContent = '显示 ' + list.length + ' / ' + DATA.length + ' 款 · 按档位排序';
        if (!list.length) { listEl.innerHTML = '<p class="bp-empty">没有匹配的开发板</p>'; return; }
        var html = '';
        list.forEach(function (b) {
          html += '<div class="bp-item" data-id="' + b.id + '">' +
            '<span class="bp-bar" style="background:' + (BC[b.fam] || '#888') + '"></span>' +
            '<span class="bp-name">' + esc(b.sn) + '<em>' + esc(BRAND[b.fam]) + '</em></span>' +
            '<span class="bp-dot" style="background:' + TC[b.tier] + '" title="' + TL[b.tier] + '"></span>' +
            '<span class="bp-arrow">›</span></div>';
        });
        listEl.innerHTML = html;
      }

      var fams = [['all', '全部']].concat(Object.keys(BRAND).map(function (k) { return [k, BRAND[k]]; }));
      fams.forEach(function (f) {
        var n = f[0] === 'all' ? DATA.length : DATA.filter(function (b) { return b.fam === f[0]; }).length;
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'bp-chip' + (f[0] === state.fam ? ' on' : '');
        btn.setAttribute('data-fam', f[0]);
        btn.innerHTML = f[1] + '<span class="n">' + n + '</span>';
        chipsEl.appendChild(btn);
      });

      chipsEl.addEventListener('click', function (e) {
        var b = e.target.closest ? e.target.closest('.bp-chip') : null;
        if (!b) return;
        state.fam = b.getAttribute('data-fam');
        Array.prototype.forEach.call(chipsEl.children, function (c) { c.classList.toggle('on', c === b); });
        render();
      });

      // ---------- 详情抽屉 ----------
      var sheet = document.getElementById('bpSheet'), body = document.getElementById('bpBody');
      function openSheet(id) {
        var b = DATA.filter(function (x) { return x.id === id; })[0];
        if (!b) return;
        var photo = b.photo
          ? '<img src="' + b.photo + '" alt="' + esc(b.n) + ' 实拍图" loading="lazy" />'
          : '<img src="img/todo.svg" alt="待补" />';
        var photoCap = b.photo
          ? '实拍图' + (b.photoMeta ? ' · ' + esc(b.photoMeta.credit) + ' · ' + esc(b.photoMeta.license) : '')
          : '实拍图待补（未找到可靠授权图，不拿相似型号顶替）';

        body.innerHTML =
          '<h3 class="bp-h">' + esc(b.n) + '</h3>' +
          '<p class="bp-sub">' + esc(b.mcu) + ' · ' + esc(b.core) + ' · ' + esc(BRAND[b.fam]) + ' · ' + TL[b.tier] + '</p>' +
          '<div class="bp-figs">' +
            '<figure class="bp-fig">' + photo + '<figcaption>' + photoCap + '</figcaption></figure>' +
            '<figure class="bp-fig"><img src="img/' + b.id + '-board.svg" alt="板型线框示意" loading="lazy" />' +
            '<figcaption>板型线框示意（非实物照片）</figcaption></figure>' +
          '</div>' +
          '<div class="bp-grid">' +
            '<div class="bp-cell"><i>主频</i><b' + (b.mhz == null ? ' class="u"' : '') + '>' + u(b.mhz, ' MHz') + '</b></div>' +
            '<div class="bp-cell"><i>SRAM</i><b' + (b.sram == null ? ' class="u"' : '') + '>' + u(b.sram, ' KB') + '</b></div>' +
            '<div class="bp-cell"><i>Flash</i><b' + (b.flash == null ? ' class="u"' : '') + '>' + u(b.flash, ' KB') + '</b></div>' +
            '<div class="bp-cell"><i>GPIO</i><b' + (b.gpio == null ? ' class="u"' : '') + '>' + u(b.gpio) + '</b></div>' +
            '<div class="bp-cell"><i>UART / SPI / I2C</i><b>' + b.bus.uart + ' / ' + b.bus.spi + ' / ' + b.bus.i2c + '</b></div>' +
            '<div class="bp-cell"><i>ADC 通道</i><b' + (b.adc == null ? ' class="u"' : '') + '>' + u(b.adc) + '</b></div>' +
            '<div class="bp-cell"><i>估算 CoreMark</i><b' + (b.cm == null ? ' class="u"' : '') + '>' + u(b.cm) + '</b></div>' +
            '<div class="bp-cell"><i>扩展性评分</i><b>' + extOf(b) + ' / 10</b></div>' +
          '</div>' +
          '<p class="bp-note">' + esc(b.note) + '</p>' +
          '<p class="bp-src">数据出处：<a href="' + esc(b.src) + '" target="_blank" rel="noopener">' + esc(b.src.replace(/^https?:\/\//, '')) + '</a></p>';

        sheet.classList.add('on');
        document.body.style.overflow = 'hidden';
        panel.scrollTop = 0;
      }
      function closeSheet() {
        sheet.classList.remove('on');
        document.body.style.overflow = '';
      }
      var panel = document.getElementById('bpPanel');
      document.getElementById('bpMask').addEventListener('click', closeSheet);
      document.getElementById('bpClose').addEventListener('click', closeSheet);
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sheet.classList.contains('on')) closeSheet(); });
      // 下滑关闭
      var startY = 0, curY = 0, dragging = false;
      panel.addEventListener('touchstart', function (e) {
        if (panel.scrollTop > 0) return;
        startY = e.touches[0].clientY; dragging = true; curY = 0;
      }, { passive: true });
      panel.addEventListener('touchmove', function (e) {
        if (!dragging) return;
        curY = e.touches[0].clientY - startY;
        if (curY > 0) panel.style.transform = 'translateY(' + curY + 'px)';
      }, { passive: true });
      panel.addEventListener('touchend', function () {
        if (!dragging) return;
        dragging = false;
        if (curY > 90) { panel.style.transform = ''; closeSheet(); }
        else panel.style.transform = '';
      });

      listEl.addEventListener('click', function (e) {
        var row = e.target.closest ? e.target.closest('.bp-item') : null;
        if (row) openSheet(row.getAttribute('data-id'));
      });

      searchEl.addEventListener('input', function () { state.q = searchEl.value; render(); });
      document.addEventListener('keydown', function (e) {
        if (e.key === '/' && document.activeElement !== searchEl) { e.preventDefault(); searchEl.focus(); }
      });

      render();
    })();
  </script>
  <script src="../../../../../assets/page.js"></script>
</body>
