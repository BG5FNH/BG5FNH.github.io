<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BG5FNH · 手机版</title>
  <style>
    :root {
      --bg: #0b0b0d;
      --gold: #c9a86a;
      --gold-soft: #8a7348;
      --text: #e6d7b8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    #view {
      position: fixed;
      inset: 0;
      display: block;
      touch-action: manipulation;
    }

    #backToOverview {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 5;
      display: none;
      align-items: center;
      gap: 6px;
      padding: 9px 13px;
      background: rgba(11, 11, 13, 0.45);
      border: 1px solid rgba(201, 168, 106, 0.35);
      border-radius: 999px;
      color: var(--gold);
      font-size: 13px;
      letter-spacing: 1px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    #backToOverview:active {
      background: rgba(201, 168, 106, 0.15);
    }

    #hint {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 4;
      color: rgba(201, 168, 106, 0.8);
      font-size: 12px;
      letter-spacing: 1px;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <button id="backToOverview" aria-label="返回主视线">
    <svg viewBox="0 0 24 24" width="18" height="18">
      <path d="M15 18l-6-6 6-6" stroke="#c9a86a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    返回
  </button>
  <div id="hint">点击金色圆点进入对应空间</div>

  <script src="../pc/js/waypoints.js"></script>
  <script>
    (function () {
      'use strict';

      var CFG = window.BG5FNH_WAYPOINTS;
      if (!CFG) {
        return;
      }

      var canvas = document.getElementById('view');
      var ctx = canvas.getContext('2d');
      var backBtn = document.getElementById('backToOverview');
      var hintEl = document.getElementById('hint');
      var touchHandledAt = 0;

      var W = 0;
      var H = 0;

      function resize() {
        W = canvas.width = window.innerWidth * (window.devicePixelRatio || 1);
        H = canvas.height = window.innerHeight * (window.devicePixelRatio || 1);
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        computeLayouts();
      }

      // ---------------- 节点数据 ----------------
      var mainNodes = [];
      var childNodes = [];

      function makeNode(def, extra) {
        return {
          def: def,
          name: def.name,
          url: def.url,
          x: 0,
          y: 0,
          tx: 0,
          ty: 0,
          radius: def.radius || 10,
          alpha: 0,
          targetAlpha: 0,
          labelAlpha: 0
        };
      }

      CFG.mainLine.nodes.forEach(function (mainDef) {
        var mainNode = makeNode(mainDef, { radius: mainDef.scale ? 16 * mainDef.scale : 14 });
        mainNode.mainDef = mainDef;
        mainNode.children = [];
        mainNodes.push(mainNode);

        (mainDef.children || []).forEach(function (childDef) {
          var childNode = makeNode(childDef, { radius: 8 });
          childNode.mainDef = mainDef;
          childNodes.push(childNode);
          mainNode.children.push(childNode);
        });
      });

      // ---------------- 布局 ----------------
      function computeLayouts() {
        var dpr = window.devicePixelRatio || 1;
        var w = W / dpr;
        var h = H / dpr;

        // 总览：主线横向，居中偏上一点
        var leftPad = Math.min(36, w * 0.06);
        var rightPad = Math.min(36, w * 0.06);
        var total = mainNodes.length;
        var usable = w - leftPad - rightPad;
        var step = total > 1 ? usable / (total - 1) : 0;
        mainNodes.forEach(function (n, i) {
          n.tx = leftPad + step * i;
          n.ty = h * 0.46;
          n.targetAlpha = 1;
          n.radius = n.mainDef.scale ? Math.round(14 * n.mainDef.scale + 4) : 14;
        });

        // 聚焦：树状图居中，子节点围绕中心
        var cx = w * 0.5;
        var cy = h * 0.50;
        var r = Math.min(w, h) * 0.21;
        var diagonal = r * 0.72;

        var DIR = {
          'center': [0, 0],
          'up': [0, -r],
          'down': [0, r],
          'left': [-r, 0],
          'right': [r, 0],
          'up-left': [-diagonal, -diagonal],
          'up-right': [diagonal, -diagonal],
          'down-left': [-diagonal, diagonal],
          'down-right': [diagonal, diagonal]
        };

        childNodes.forEach(function (n) {
          var d = DIR[n.def.dir] || DIR.center;
          n.tx = cx + d[0];
          n.ty = cy + d[1];
          n.targetAlpha = 0;
          n.radius = n.def.dir === 'center' ? 13 : 9;
        });
      }

      // ---------------- 状态 ----------------
      var mode = 'overview'; // overview | focus
      var focusMain = null;
      var mainLineAlpha = 1;
      var targetMainLineAlpha = 1;
      var treeAlpha = 0;
      var targetTreeAlpha = 0;

      function setMode(newMode, mainDef) {
        mode = newMode;
        focusMain = mainDef;
        if (newMode === 'overview') { try { sessionStorage.removeItem('bg5fnh_focus'); } catch (e) {} }
        if (mode === 'focus') {
          targetMainLineAlpha = 0;
          targetTreeAlpha = 1;
          mainNodes.forEach(function (n) { n.targetAlpha = 0; });
          childNodes.forEach(function (n) { n.targetAlpha = n.mainDef === mainDef ? 1 : 0; });
          if (backBtn) backBtn.style.display = 'flex';
          if (hintEl) hintEl.style.opacity = '0';
        } else {
          targetMainLineAlpha = 1;
          targetTreeAlpha = 0;
          mainNodes.forEach(function (n) { n.targetAlpha = 1; });
          childNodes.forEach(function (n) { n.targetAlpha = 0; });
          if (backBtn) backBtn.style.display = 'none';
          if (hintEl) {
            hintEl.textContent = '点击金色圆点进入对应空间';
            hintEl.style.opacity = '1';
          }
        }
      }

      function openNode(mainDef, childDef) {
        try {
          sessionStorage.setItem('bg5fnh_focus', mainDef.id);
        } catch (e) { }
        window.location.href = '../WayPoints/' + childDef.url;
      }

      // ---------------- 动画更新 ----------------
      function update(dt) {
        var k = 1 - Math.pow(0.0008, dt); // 慢速缓动
        mainNodes.forEach(function (n) {
          n.x += (n.tx - n.x) * k;
          n.y += (n.ty - n.y) * k;
          n.alpha += (n.targetAlpha - n.alpha) * k;
        });
        childNodes.forEach(function (n) {
          n.x += (n.tx - n.x) * k;
          n.y += (n.ty - n.y) * k;
          n.alpha += (n.targetAlpha - n.alpha) * k;
        });
        mainLineAlpha += (targetMainLineAlpha - mainLineAlpha) * k;
        treeAlpha += (targetTreeAlpha - treeAlpha) * k;
      }

      // ---------------- 绘制 ----------------
      function drawGlow(x, y, radius, alpha) {
        if (alpha <= 0.02) return;
        var dpr = window.devicePixelRatio || 1;
        var px = x * dpr;
        var py = y * dpr;
        var pr = radius * dpr;

        var grad = ctx.createRadialGradient(px, py, 0, px, py, pr * 2.6);
        grad.addColorStop(0, 'rgba(240,226,196,' + (0.95 * alpha) + ')');
        grad.addColorStop(0.25, 'rgba(201,168,106,' + (0.85 * alpha) + ')');
        grad.addColorStop(0.55, 'rgba(138,115,72,' + (0.32 * alpha) + ')');
        grad.addColorStop(1, 'rgba(138,115,72,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(px, py, pr * 2.6, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawLine(x1, y1, x2, y2, alpha, width, color) {
        if (alpha <= 0.02) return;
        var dpr = window.devicePixelRatio || 1;
        ctx.strokeStyle = color || 'rgba(201,168,106,' + alpha + ')';
        ctx.lineWidth = (width || 1.5) * dpr;
        ctx.beginPath();
        ctx.moveTo(x1 * dpr, y1 * dpr);
        ctx.lineTo(x2 * dpr, y2 * dpr);
        ctx.stroke();
      }

      function drawLabel(text, x, y, alpha, big) {
        if (alpha <= 0.02) return;
        var dpr = window.devicePixelRatio || 1;
        ctx.fillStyle = 'rgba(201,168,106,' + alpha + ')';
        ctx.font = ((big ? 13 : 11) * dpr) + 'px "Microsoft YaHei","PingFang SC",sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(text, x * dpr, y * dpr);
      }

      function draw() {
        var dpr = window.devicePixelRatio || 1;
        var w = W / dpr;
        var h = H / dpr;
        ctx.clearRect(0, 0, W, H);

        // 背景
        ctx.fillStyle = '#0b0b0d';
        ctx.fillRect(0, 0, W, H);

        // 主线（总览）与树状线（聚焦）
        if (mainLineAlpha > 0.02) {
          for (var i = 0; i < mainNodes.length - 1; i++) {
            drawLine(mainNodes[i].x, mainNodes[i].y, mainNodes[i + 1].x, mainNodes[i + 1].y, mainLineAlpha * 0.75, 1.5);
          }
        }

        if (treeAlpha > 0.02 && focusMain) {
          var center = null;
          childNodes.forEach(function (n) {
            if (n.mainDef === focusMain && n.def.dir === 'center') {
              center = n;
            }
          });
          if (center) {
            childNodes.forEach(function (n) {
              if (n.mainDef === focusMain && n !== center) {
                drawLine(center.x, center.y, n.x, n.y, treeAlpha * 0.85, 1.2);
              }
            });
          }
        }

        // 点与标签
        mainNodes.forEach(function (n) {
          drawGlow(n.x, n.y, n.radius, n.alpha);
          drawLabel(n.name, n.x, n.y + n.radius + 5, n.alpha, n.mainDef.scale > 1.2);
        });

        childNodes.forEach(function (n) {
          drawGlow(n.x, n.y, n.radius, n.alpha);
          drawLabel(n.name, n.x, n.y + n.radius + 5, n.alpha, false);
        });

        // 空状态提示
        if (mode === 'overview') {
          // 由 hint 元素负责
        }
      }

      // ---------------- 点击检测 ----------------
      function hitTest(x, y) {
        var dpr = window.devicePixelRatio || 1;
        var px = x;
        var py = y;

        if (mode === 'overview') {
          for (var i = mainNodes.length - 1; i >= 0; i--) {
            var n = mainNodes[i];
            if (n.alpha < 0.5) continue;
            var dx = px - n.x;
            var dy = py - n.y;
            if (dx * dx + dy * dy <= (n.radius + 16) * (n.radius + 16)) {
              return { type: 'main', node: n };
            }
            // 标签区域
            if (Math.abs(dx) <= 34 && dy > n.radius && dy < n.radius + 28) {
              return { type: 'main', node: n };
            }
          }
        } else if (mode === 'focus' && focusMain) {
          for (var j = childNodes.length - 1; j >= 0; j--) {
            var c = childNodes[j];
            if (c.mainDef !== focusMain || c.alpha < 0.5) continue;
            var dx2 = px - c.x;
            var dy2 = py - c.y;
            if (dx2 * dx2 + dy2 * dy2 <= (c.radius + 16) * (c.radius + 16)) {
              return { type: 'child', node: c };
            }
            if (Math.abs(dx2) <= 32 && dy2 > c.radius && dy2 < c.radius + 26) {
              return { type: 'child', node: c };
            }
          }
        }
        return null;
      }

      function handleTap(e) {
        var rect = canvas.getBoundingClientRect();
        var sx = (e.touches && e.touches[0] ? e.touches[0].clientX : e.clientX);
        var sy = (e.touches && e.touches[0] ? e.touches[0].clientY : e.clientY);
        var x = sx - rect.left;
        var y = sy - rect.top;
        var hit = hitTest(x, y);
        if (!hit) return;

        if (hit.type === 'main') {
          setMode('focus', hit.node.mainDef);
        } else if (hit.type === 'child') {
          openNode(hit.node.mainDef, hit.node.def);
        }
      }

      canvas.addEventListener('click', function (e) { if (Date.now() - touchHandledAt < 600) return; handleTap(e); });
      canvas.addEventListener('touchstart', function (e) {
        // 阻止双击缩放干扰
        e.preventDefault();
        touchHandledAt = Date.now();
        handleTap(e);
      }, { passive: false });

      if (backBtn) {
        backBtn.addEventListener('click', function () {
          if (mode === 'focus') {
            setMode('overview', null);
          }
        });
      }

      // ---------------- 恢复上次聚焦 ----------------
      function restoreFocus() {
        var saved = null;
        try {
          saved = sessionStorage.getItem('bg5fnh_focus');
          sessionStorage.removeItem('bg5fnh_focus');
        } catch (e) { }
        if (!saved) return;
        var found = null;
        mainNodes.forEach(function (n) {
          if (n.mainDef.id === saved) found = n;
        });
        if (!found) return;

        // 直接定位到聚焦布局
        setMode('focus', found.mainDef);
        mainNodes.forEach(function (n) {
          n.x = n.tx;
          n.y = n.ty;
          n.alpha = n.targetAlpha;
        });
        childNodes.forEach(function (n) {
          n.x = n.tx;
          n.y = n.ty;
          n.alpha = n.targetAlpha;
        });
        mainLineAlpha = targetMainLineAlpha;
        treeAlpha = targetTreeAlpha;
      }

      // ---------------- 启动 ----------------
      var lastTime = performance.now();
      function loop(now) {
        var dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }

      window.addEventListener('resize', resize);
      resize();
      setMode('overview', null);
      // 初始位置直接到位，不播放多余动画
      mainNodes.forEach(function (n) { n.x = n.tx; n.y = n.ty; n.alpha = 1; });
      childNodes.forEach(function (n) { n.x = n.tx; n.y = n.ty; n.alpha = 0; });
      restoreFocus();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
