<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BG5FNH · 手机版</title>
  <meta name="description" content="BG5FNH（肖和）的个人主页：业余无线电、软件与硬件、编程与资料分享。" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="BG5FNH · 个人网页" />
  <meta property="og:description" content="业余无线电、软件与硬件、编程与资料分享。" />
  <meta property="og:url" content="https://bg5fnh.github.io/" />
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <style>
    :root {
      --bg: #0b0b0d;
      --gold: #c9a86a;
      --gold-soft: #8a7348;
      --gold-line: #4a4033;
      --text: #e6d7b8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    #stage {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    #stage canvas {
      display: block;
        touch-action: none;
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .node-hit,
    .node-label {
      display: none;
    }

    .node-hit {
      position: absolute;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: transparent;
      border: none;
      cursor: pointer;
      pointer-events: auto;
      transition: box-shadow 0.25s ease, background 0.25s ease;
    }

    .node-hit:hover {
      background: rgba(201, 168, 106, 0.08);
      box-shadow: 0 0 24px rgba(201, 168, 106, 0.45), inset 0 0 12px rgba(201, 168, 106, 0.25);
    }

    .node-label {
      position: absolute;
      transform: translate(-50%, 0);
      text-align: center;
      white-space: nowrap;
      color: var(--gold);
      font-size: 14px;
      letter-spacing: 2px;
      pointer-events: auto;
      cursor: pointer;
      text-shadow: 0 0 12px rgba(201, 168, 106, 0.35);
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }

    .node-label:hover {
      color: #f0e2c4;
      text-shadow: 0 0 18px rgba(201, 168, 106, 0.65);
    }

    .node-label.big {
      font-size: 17px;
      letter-spacing: 3px;
    }

    #backToOverview {
      position: fixed;
      top: 22px;
      left: 22px;
      z-index: 5;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: rgba(11, 11, 13, 0.45);
      border: 1px solid rgba(201, 168, 106, 0.35);
      border-radius: 999px;
      color: var(--gold);
      cursor: pointer;
      font-size: 14px;
      letter-spacing: 1px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: auto;
      transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
    }

    #backToOverview:hover {
      background: rgba(201, 168, 106, 0.12);
      border-color: var(--gold);
      color: #f0e2c4;
      box-shadow: 0 0 18px rgba(201, 168, 106, 0.22);
    }

    #backToOverview svg {
      display: block;
    }

    /* 站点标名 */
    #siteTitle {
      position: fixed;
      top: 26px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      text-align: center;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    #siteTitle h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 7px;
      color: var(--gold);
      text-shadow: 0 0 18px rgba(201, 168, 106, 0.35);
    }

    #siteTitle p {
      margin: 6px 0 0;
      font-size: 10px;
      letter-spacing: 2px;
      color: rgba(201, 168, 106, 0.6);
    }

    /* 版本号只在 ?dev 时显示 */
    #versionBadge {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 5;
      display: none;
      padding: 5px 10px;
      background: rgba(11, 11, 13, 0.45);
      border: 1px solid rgba(201, 168, 106, 0.3);
      border-radius: 999px;
      color: rgba(201, 168, 106, 0.75);
      font-size: 11px;
      letter-spacing: 1px;
      pointer-events: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity 0.3s ease;
    }


    #hint {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      z-index: 3;
      color: rgba(201, 168, 106, 0.75);
      font-size: 13px;
      letter-spacing: 2px;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
      transition: opacity 0.6s ease;
    }

    #fallback {
      position: fixed;
      inset: 0;
      z-index: 9;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--bg);
      color: var(--gold);
      padding: 30px;
      line-height: 2;
    }

    #pageOverlay {
      position: fixed;
      inset: 0;
      z-index: 8;
      display: none;
      pointer-events: none;
    }

    #pageOverlay.active {
      display: block;
      pointer-events: auto;
    }

    #pageOverlay .page-blur {
      position: absolute;
      inset: 0;
      background: rgba(11, 11, 13, 0.16);
      backdrop-filter: blur(4px) brightness(0.78);
      -webkit-backdrop-filter: blur(4px) brightness(0.78);
      opacity: 0;
      transition: opacity 0.55s ease;
    }

    #pageOverlay.active .page-blur {
      opacity: 1;
    }

    #pageFrame {
      position: absolute;
      left: 2vw;
      top: 2vh;
      width: 96vw;
      height: 96vh;
      border: 1px solid rgba(201, 168, 106, 0.45);
      border-radius: 14px;
      background: transparent;
      box-shadow: 0 0 70px rgba(201, 168, 106, 0.22), 0 0 0 1px rgba(201, 168, 106, 0.1) inset;
      overflow: hidden;
      opacity: 0;
      transform: scale(0.05);
      transform-origin: 50% 50%;
      transition: transform 0.8s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.55s ease;
    }

    #pageOverlay.active #pageFrame {
      opacity: 1;
      transform: scale(1);
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="overlay"></div>
  <div id="siteTitle">
    <h1>BG5FNH</h1>
    <p>肖和 · 业余无线电 · 软硬件与编程</p>
  </div>
  <div id="versionBadge">v1.7.2</div>
  <button id="backToOverview" aria-label="返回">
    <svg viewBox="0 0 24 24" width="20" height="20">
      <path d="M15 18l-6-6 6-6" stroke="#c9a86a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <span id="backLabel">返回</span>
  </button>
  <div id="hint">点击金色圆点进入 · 空白处拖动平移 · 双指缩放</div>
  <div id="fallback">
    <div>
      <p>3D 主场景没有启动成功。</p>
      <p>请确认 <code style="color:#f0e2c4;">pc/js/three.min.js</code> 已就位，或用电脑版入口重新打开。</p>
    </div>
  </div>
  <div id="pageOverlay">
    <div class="page-blur"></div>
    <iframe id="pageFrame" title="内容页面" src="about:blank" allow="geolocation; microphone; camera; fullscreen; clipboard-write; autoplay" allowfullscreen></iframe>
  </div>

  <script>window.BG5FNH_MOBILE_LAYOUT = true;</script>
  <script src="../pc/js/three.min.js?v=1.7.2"></script>
  <script src="../points/waypoints.js?v=1.7.2"></script>
  <script src="../pc/js/main3d.js?v=1.7.2"></script>
</body>
</html>
