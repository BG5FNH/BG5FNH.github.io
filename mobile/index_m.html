<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BG5FNH · 手机版</title>
  <meta name="description" content="BG5FNH（肖和）的个人主页：业余无线电、软件与硬件、编程与资料分享。" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="BG5FNH · 个人网页" />
  <meta property="og:description" content="业余无线电、软件与硬件、编程与资料分享。" />
  <meta property="og:url" content="https://bg5fnh.github.io/" />
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <style>
    :root {
      --bg: #0b0b0d;
      --gold: #c9a86a;
      --gold-soft: #8a7348;
      --gold-line: #4a4033;
      --text: #e6d7b8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    #stage {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    #stage canvas {
      display: block;
        touch-action: none;
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .node-hit,
    .node-label {
      display: none;
    }

    .node-hit {
      position: absolute;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: transparent;
      border: none;
      cursor: pointer;
      pointer-events: auto;
      transition: box-shadow 0.25s ease, background 0.25s ease;
    }

    .node-hit:hover {
      background: rgba(201, 168, 106, 0.08);
      box-shadow: 0 0 24px rgba(201, 168, 106, 0.45), inset 0 0 12px rgba(201, 168, 106, 0.25);
    }

    .node-label {
      position: absolute;
      transform: translate(-50%, 0);
      text-align: center;
      white-space: nowrap;
      color: var(--gold);
      font-size: 14px;
      letter-spacing: 2px;
      pointer-events: auto;
      cursor: pointer;
      text-shadow: 0 0 12px rgba(201, 168, 106, 0.35);
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }

    .node-label:hover {
      color: #f0e2c4;
      text-shadow: 0 0 18px rgba(201, 168, 106, 0.65);
    }

    .node-label.big {
      font-size: 17px;
      letter-spacing: 3px;
    }

    #backToOverview {
      position: fixed;
      top: 22px;
      left: 22px;
      z-index: 5;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: rgba(11, 11, 13, 0.45);
      border: 1px solid rgba(201, 168, 106, 0.35);
      border-radius: 999px;
      color: var(--gold);
      cursor: pointer;
      font-size: 14px;
      letter-spacing: 1px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: auto;
      transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
    }

    #backToOverview:hover {
      background: rgba(201, 168, 106, 0.12);
      border-color: var(--gold);
      color: #f0e2c4;
      box-shadow: 0 0 18px rgba(201, 168, 106, 0.22);
    }

    #backToOverview svg {
      display: block;
    }

    /* 站点标名 */
    #siteTitle {
      position: fixed;
      top: 26px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      text-align: center;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    #siteTitle h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 7px;
      color: var(--gold);
      text-shadow: 0 0 18px rgba(201, 168, 106, 0.35);
    }

    #siteTitle p {
      margin: 6px 0 0;
      font-size: 10px;
      letter-spacing: 2px;
      color: rgba(201, 168, 106, 0.6);
    }

    /* 版本号只在 ?dev 时显示 */
    #versionBadge {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 5;
      display: none;
      padding: 5px 10px;
      background: rgba(11, 11, 13, 0.45);
      border: 1px solid rgba(201, 168, 106, 0.3);
      border-radius: 999px;
      color: rgba(201, 168, 106, 0.75);
      font-size: 11px;
      letter-spacing: 1px;
      pointer-events: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity 0.3s ease;
    }


    #hint {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      z-index: 3;
      color: rgba(201, 168, 106, 0.75);
      font-size: 13px;
      letter-spacing: 2px;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
      transition: opacity 0.6s ease;
    }

    #fallback {
      position: fixed;
      inset: 0;
      z-index: 9;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--bg);
      color: var(--gold);
      padding: 30px;
      line-height: 2;
    }

    #pageOverlay {
      position: fixed;
      inset: 0;
      z-index: 8;
      display: none;
      pointer-events: none;
    }

    #pageOverlay.active {
      display: block;
      pointer-events: auto;
    }

    #pageOverlay .page-blur {
      position: absolute;
      inset: 0;
      background: rgba(11, 11, 13, 0.16);
      backdrop-filter: blur(4px) brightness(0.78);
      -webkit-backdrop-filter: blur(4px) brightness(0.78);
      opacity: 0;
      transition: opacity 0.55s ease;
    }

    #pageOverlay.active .page-blur {
      opacity: 1;
    }

    #pageFrame {
      position: absolute;
      left: 2vw;
      top: 2vh;
      width: 96vw;
      height: 96vh;
      border: 1px solid rgba(201, 168, 106, 0.45);
      border-radius: 14px;
      background: transparent;
      box-shadow: 0 0 70px rgba(201, 168, 106, 0.22), 0 0 0 1px rgba(201, 168, 106, 0.1) inset;
      overflow: hidden;
      opacity: 0;
      transform: scale(0.05);
      transform-origin: 50% 50%;
      transition: transform 0.8s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.55s ease;
    }

    #pageOverlay.active #pageFrame {
      opacity: 1;
      transform: scale(1);
    }

    /* ===== 加载中的黑金 LOADING：就绪后像水墨一样晕开，再放出光点 ===== */
    #stage {
      opacity: 0;
      transition: opacity 1s ease 0.2s;
    }

    body.ready #stage { opacity: 1; }

    /* 光点、连线、标签、底部提示都比"墨"晚一点浮出来，避免和 LOADING 抢视线 */
    #overlay {
      opacity: 0;
      transition: opacity 0.9s ease 0.75s;
    }

    body.ready #overlay { opacity: 1; }

    body:not(.ready2) #siteTitle { opacity: 0 !important; }
    body.ready #siteTitle { transition-delay: 0.85s; }

    body:not(.ready2) #hint { opacity: 0 !important; }
    body.ready #hint { transition-delay: 1.1s; }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 24px;
      overflow: hidden;
    }

    /* 黑底单独一层：晕开时先化掉它，后面的光点才透出来 */
    .ld-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 46%, #12100f 0%, #0b0b0d 58%);
      transition: opacity 1s ease;
    }

    #loading.out .ld-bg { opacity: 0; }

    #loading.out { pointer-events: none; }

    .ld-ink {
      position: absolute;
      width: 46vmax;
      height: 46vmax;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201, 168, 106, 0.3) 0%, rgba(201, 168, 106, 0.1) 38%, rgba(201, 168, 106, 0) 68%);
      filter: blur(30px);
      transform: scale(0.5);
      opacity: 0.5;
      transition: transform 1.9s cubic-bezier(0.16, 0.8, 0.3, 1), opacity 1.6s ease;
    }

    #loading.out .ld-ink { transform: scale(2.6); opacity: 0; }

    /* 墨晕：字的残影往外洇开，再化掉 —— 这一层才是"水墨"的主体 */
    .ld-ghost {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(1);
      font-family: "Times New Roman", Georgia, "Songti SC", serif;
      font-size: clamp(26px, 8.4vw, 42px);
      font-weight: 500;
      letter-spacing: 0.3em;
      color: rgba(214, 180, 120, 0.95);
      filter: blur(8px);
      opacity: 0;
      pointer-events: none;
      will-change: transform, opacity, filter;
    }

    #loading.out .ld-ghost { animation: inkBleedOut 2.6s cubic-bezier(0.25, 0.7, 0.2, 1) forwards; }

    @keyframes inkBleedOut {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(1); filter: blur(8px); }
      22% { opacity: 0.62; transform: translate(-50%, -50%) scale(1.1); filter: blur(12px); }
      55% { opacity: 0.5; transform: translate(-50%, -50%) scale(1.32); filter: blur(20px); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.78); filter: blur(34px); }
    }

    .ld-word {
      position: relative;
      display: flex;
      font-family: "Times New Roman", Georgia, "Songti SC", serif;
      font-size: clamp(26px, 8.4vw, 42px);
      font-weight: 500;
      letter-spacing: 0.3em;
      margin-right: -0.3em;
      background: linear-gradient(180deg, #f5e9cd 0%, #d8b579 42%, #9c8049 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: url(#inkBleed) drop-shadow(0 0 18px rgba(201, 168, 106, 0.32));
      transition: letter-spacing 1.5s ease, opacity 1.5s ease 0.2s;
    }

    .ld-word span {
      display: inline-block;
      animation: ldIn 1s ease both;
      animation-delay: calc(var(--d) * 70ms);
    }

    @keyframes ldIn {
      from { opacity: 0; filter: blur(10px); }
      to { opacity: 1; filter: blur(0); }
    }

    #loading.out .ld-word { letter-spacing: 0.54em; opacity: 0; }

    .ld-bar {
      position: relative;
      width: 148px;
      height: 1px;
      background: rgba(201, 168, 106, 0.18);
      overflow: hidden;
    }

    .ld-bar i {
      position: absolute;
      top: 0;
      left: -40%;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, rgba(201, 168, 106, 0) 0%, #c9a86a 50%, rgba(201, 168, 106, 0) 100%);
      animation: ldSweep 1.7s ease-in-out infinite;
    }

    #loading.out .ld-bar { opacity: 0; transition: opacity 0.4s ease; }

    @keyframes ldSweep {
      0% { left: -40%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <!-- 墨化滤镜：噪声位移让笔画边缘毛糙，再用模糊把墨洇开 -->
  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <filter id="inkBleed" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feTurbulence id="inkNoise" type="fractalNoise" baseFrequency="0.012 0.028" numOctaves="2" seed="11" result="noise" />
      <feDisplacementMap id="inkDisp" in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="warp" />
      <feGaussianBlur id="inkBlur" in="warp" stdDeviation="0.35" />
    </filter>
  </svg>
  <div id="loading" role="status" aria-label="正在加载">
    <div class="ld-bg" aria-hidden="true"></div>
    <div class="ld-ink" aria-hidden="true"></div>
    <div class="ld-ghost" aria-hidden="true">LOADING</div>
    <div class="ld-word" aria-hidden="true">
      <span style="--d:5">L</span><span style="--d:3">O</span><span style="--d:1">A</span><span style="--d:0">D</span><span style="--d:1">I</span><span style="--d:3">N</span><span style="--d:5">G</span>
    </div>
    <div class="ld-bar" aria-hidden="true"><i></i></div>
  </div>
  <div id="stage"></div>
  <div id="overlay"></div>
  <div id="siteTitle">
    <h1>BG5FNH</h1>
    <p>肖和 · 业余无线电 · 软硬件与编程</p>
  </div>
  <div id="versionBadge">v1.26.0</div>
  <button id="backToOverview" aria-label="返回">
    <svg viewBox="0 0 24 24" width="20" height="20">
      <path d="M15 18l-6-6 6-6" stroke="#c9a86a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <span id="backLabel">返回</span>
  </button>
  <div id="hint">点击金色圆点进入 · 空白处拖动平移 · 双指缩放</div>
  <div id="fallback">
    <div>
      <p>3D 主场景没有启动成功。</p>
      <p>请确认 <code style="color:#f0e2c4;">pc/js/three.min.js</code> 已就位，或用电脑版入口重新打开。</p>
    </div>
  </div>
  <div id="pageOverlay">
    <div class="page-blur"></div>
    <iframe id="pageFrame" title="内容页面" src="about:blank" allow="geolocation; microphone; camera; fullscreen; clipboard-write; autoplay" allowfullscreen></iframe>
  </div>

  <script>window.BG5FNH_MOBILE_LAYOUT = true;</script>
  <script>
    (function () {
      var el = document.getElementById('loading');
      if (!el) return;
      var out = false;
      var t0 = Date.now();

      // 墨化：噪声位移把笔画边缘推毛，模糊让墨往四周洇开；淡出交给 CSS
      function inkSpread(ms) {
        var disp = document.getElementById('inkDisp');
        var blur = document.getElementById('inkBlur');
        var noise = document.getElementById('inkNoise');
        if (!disp || !blur) return;
        var start = performance.now();
        function frame(now) {
          var p = Math.min(1, (now - start) / ms);
          var e = 1 - Math.pow(1 - p, 2.6);
          disp.setAttribute('scale', (2.4 + 16 * e).toFixed(2));
          blur.setAttribute('stdDeviation', (0.35 + 5.6 * e).toFixed(2));
          if (noise) noise.setAttribute('baseFrequency',
            (0.012 + 0.014 * e).toFixed(4) + ' ' + (0.028 + 0.022 * e).toFixed(4));
          if (p < 1) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }

      function dissolve() {
        if (out) return;
        out = true;
        var wait = Math.max(0, 700 - (Date.now() - t0));
        window.setTimeout(function () {
          document.body.classList.add('ready');   // 光点淡入
          window.setTimeout(function () { document.body.classList.add('ready2'); }, 900); // 呼号与底部提示再晚一点
          el.classList.add('out');                // 黑底、光晕、字开始化
          inkSpread(1200);                        // 字像墨一样晕开
          window.setTimeout(function () { el.style.display = 'none'; }, 2800);
        }, wait);
      }
      window.__bg5fnhReady = dissolve;
      window.__bg5fnhFail = function () {
        var f = document.getElementById('fallback');
        if (f) f.style.display = 'flex';
        dissolve();
      };
      window.setTimeout(function () {
        if (typeof window.THREE === 'undefined') window.__bg5fnhFail();
        else dissolve();
      }, 40000);
    })();
  </script>
  <script src="../pc/js/three.min.js?v=1.26.0" onerror="window.__bg5fnhFail && window.__bg5fnhFail()"></script>
  <script src="../points/waypoints.js?v=1.26.0"></script>
  <script src="../pc/js/main3d.js?v=1.26.0"></script>
</body>
</html>
