<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BG5FNH · 识别中</title>
    <style>
        /* 加载过渡页面的样式（让用户知道正在跳转） */
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b1120;
            color: #e6f1ff;
            margin: 0;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p style="margin-top: 1rem; color: #94a3b8;">正在识别您的设备...</p>
    </div>

    <script>
        // ============================================================
        // 核心检测逻辑（比单纯 UA 更可靠）
        // ============================================================
        function detectDevice() {
            const width = window.innerWidth;
            const hasTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            const ua = navigator.userAgent.toLowerCase();
            const isMobileUA = /mobile|android|iphone|ipad|ipod|blackberry|iemobile|opera mini/.test(ua);

            // 平板（iPad等）归为电脑，除非屏幕特别小
            const isTablet = /ipad|tablet/.test(ua) && width >= 768;

            if (isTablet) return 'pc';

            // 核心规则：宽度 < 768 且（支持触摸 或 UA 含移动关键词）
            if (width < 768 || (hasTouch && isMobileUA)) {
                return 'mobile';
            }
            return 'pc';
        }

        // ============================================================
        // 执行跳转（带 300ms 延迟，确保加载过渡动画可见）
        // ============================================================
        const device = detectDevice();
        const targetPath = device === 'mobile' ? '/mobile/' : '/pc/';

        // 延迟跳转，让用户看到过渡提示（也可不加延迟直接跳）
        setTimeout(function() {
            window.location.href = targetPath;
        }, 300);
    </script>
</body>
</html>
