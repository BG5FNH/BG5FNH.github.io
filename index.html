<!DOCTYPE html>
<html>、
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳转中</title>
    <style>
        body { background: black; margin: 0; }  /* 纯黑背景 */
    </style>
</head>
<body>
    <script>
        // 1. 获取浏览器的用户代理（设备名片）
        let ua = navigator.userAgent;

        // 2. 检查是否包含手机关键词（Android/iPhone/手机）
        let isMobile = /Android|iPhone|iPad|Mobile/i.test(ua);

        // 3. 根据结果决定跳转路径
        let target = isMobile ? '/mobile/' : '/pc/';

        // 4. 执行跳转
        window.location.href = target;
    </script>
</body>
</html>
